<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="290" viewBox="0 0 1100 290" role="img" aria-labelledby="title desc"><title id="title">paylint architecture</title><desc id="desc">URLs and QR images pass through an offline decoder and parser to request details and exports. No wallets or endpoint fetches.</desc><rect width="1100" height="290" rx="16" fill="#101113"/><g font-family="system-ui,sans-serif"><text x="36" y="48" font-size="23" fill="#e6e8e9">paylint / offline by design</text><g fill="#1a1c1f" stroke="#454a50"><rect x="36" y="100" width="210" height="92" rx="10"/><rect x="300" y="100" width="210" height="92" rx="10"/><rect x="564" y="100" width="210" height="92" rx="10"/><rect x="828" y="100" width="236" height="92" rx="10"/></g><g fill="#9ae7c3" font-size="24"><text x="265" y="153">→</text><text x="529" y="153">→</text><text x="793" y="153">→</text></g><g fill="#e6e8e9" font-size="17"><text x="56" y="140">URL / QR image</text><text x="320" y="140">Local decoder</text><text x="584" y="140">Strict URL parser</text><text x="848" y="140">Dashboard / CLI</text></g><g fill="#a9afb6" font-size="13"><text x="56" y="168">Paste or open a file</text><text x="320" y="168">QR stays in the browser</text><text x="584" y="168">Exact amounts + diagnostics</text><text x="848" y="168">Copy / JSON / Markdown</text><text x="36" y="245">No endpoint fetches. No wallet. Payment safety and status remain unverified.</text></g></g></svg>
